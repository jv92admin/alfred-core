[project]
name = "alfred-DOMAIN"                          # TODO: your package name (e.g., "alfred-fitness")
version = "0.1.0"
description = "Alfred DOMAIN — TODO: one-line description"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TODO" }]

dependencies = [
    # Core engine (from PyPI) — import name is "alfred", not "alfredagain"
    "alfredagain>=2.0.0",

    # Database
    "supabase>=2.0.0",

    # TODO: add domain-specific dependencies here
    # "httpx>=0.27.0",
    # "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

# TODO: uncomment if you want a CLI entry point
# [project.scripts]
# alfred-DOMAIN = "alfred_DOMAIN.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alfred_DOMAIN"]                # TODO: rename to your package

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
